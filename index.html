<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS Guessr</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 15px; padding-bottom: 60px; }
        h1 { color: #e94560; font-size: 28px; margin-bottom: 8px; font-weight: 800; letter-spacing: 1px; }
        
        .game-subtitle { color: #cccccc; font-size: 14px; margin: 0 auto 15px auto; font-weight: bold; letter-spacing: 0.5px; }

        /* 模式状态标签 */
        .mode-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; background: #2a2a40; color: #aaa; }
        .mode-local { background: #0284c7; color: #fff; }
        .mode-online { background: #b91c1c; color: #fff; }

        /* 倒计时样式 */
        .timer-banner { display: none; font-size: 20px; font-weight: 800; color: #ffb703; margin: 10px auto; text-shadow: 0 0 8px rgba(255,183,3,0.5); }

        /* 可折叠的联机大厅面板 */
        .lobby-panel { width: 95%; max-width: 500px; background: #16213e; border-radius: 12px; padding: 12px; margin: 0 auto 15px auto; border: 1px solid #304163; box-sizing: border-box; }
        .lobby-toggle { background: none; border: none; color: #e94560; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto; gap: 5px; }
        .lobby-content { display: none; margin-top: 10px; border-top: 1px solid #1a1a2e; padding-top: 10px; }
        .room-status { font-size: 14px; color: #ff4560; font-weight: bold; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-sm { padding: 10px; font-size: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; border: none; color: white; }
        .btn-create { background: #4caf50; }
        .btn-join { background: #008cba; }

        /* BO赛制选择器 */
        .bo-selector { margin: 10px 0; font-size: 14px; color: #ccc; }
        .bo-selector label { margin: 0 8px; cursor: pointer; font-weight: bold; }
        .bo-selector input { width: auto; margin-right: 4px; }

        /* 实时数据监控 */
        .battle-board { display: none; width: 95%; max-width: 500px; background: #16213e; border-radius: 12px; padding: 12px; margin: 15px auto; border: 1px solid #e94560; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .player-score { text-align: center; flex: 1; padding: 5px; border-radius: 8px; }
        .score-num { font-size: 24px; font-weight: 800; margin: 2px 0; color: #e94560; }
        .player-state { font-size: 13px; color: #ffb703; font-weight: bold; }
        .match-info { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* 搜索框与下拉菜单 */
        .search-container { position: relative; width: 95%; max-width: 500px; margin: 0 auto 15px auto; text-align: left; }
        input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #e94560; outline: none; background-color: #16213e; color: #fff; }
        input::placeholder { color: #888; }
        input:disabled { background-color: #0f172a; border-color: #334155; color: #64748b; cursor: not-allowed; }
        .dropdown { position: absolute; top: 100%; left: 0; right: 0; background-color: #16213e; border: 1px solid #e94560; border-top: none; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .dropdown-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #1a1a2e; font-size: 16px; }
        .dropdown-item:hover { background-color: #e94560; color: white; }
        
        button.action-btn { padding: 12px 25px; font-size: 16px; background-color: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(233, 69, 96, 0.3); width: 95%; max-width: 500px; margin-bottom: 15px; }
        button.action-btn:active { background-color: #b33045; transform: scale(0.98); }
        button:disabled { background: #334155 !important; color: #64748b !important; cursor: not-allowed; box-shadow: none !important; }

        /* 数据表格样式 */
        .table-container { width: 95%; max-width: 500px; margin: 0 auto; overflow-x: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; background-color: #16213e; color: #fff; font-size: 14px; text-align: center; min-width: 400px; }
        th { background-color: #0f172a; color: #e94560; font-weight: bold; padding: 12px 8px; border-bottom: 2px solid #e94560; }
        td { padding: 12px 8px; border-bottom: 1px solid #1a1a2e; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .cell-green { background-color: #2e7d32 !important; color: #fff; }
        .cell-yellow { background-color: #f9a825 !important; color: #fff; }
        .cell-red { background-color: #c62828 !important; color: #fff; }

        .watermark { position: fixed; bottom: 15px; right: 15px; font-size: 0.8rem; color: rgba(255,255,255,0.15); font-weight: bold; pointer-events: none; }
    </style>
</head>

    <h1>CS Guessr</h1>
    <div class="game-subtitle">根据已知信息猜CS选手</div>
    
    <div class="mode-badge id-mode-badge" id="modeBadge">📴 单机练习模式</div>

        <div class="lobby-content" id="lobbyContent">

            <div id="lobbyControls">
                <div class="bo-selector" id="boSelectorContainer">
                    <span>选择赛制：</span>
                    <label><input type="radio" name="boType" value="1" checked> BO1</label>
                    <label><input type="radio" name="boType" value="3"> BO3</label>

                </div>
                <input type="text" id="roomCodeInput" placeholder="输入自定义房间号" style="padding: 10px; margin-bottom: 5px; font-size: 15px; width: 90%; max-width: 280px; box-sizing: border-box;">
                <div class="btn-group">

                    <button class="btn-sm btn-join" onclick="joinRoom()">加入房间</button>
                </div>
            </div>
        </div>
    </div>

    <div class="battle-board" id="battleBoard">
        <div class="player-score" id="p1Box">
            <div style="color: #4da6ff; font-weight: bold; font-size: 14px;">房主 (胜场)</div>

        <div style="font-style: italic; color: #e94560; font-weight: bold; padding: 0 10px; font-size: 20px;">
            VS

        </div>
        <div class="player-score" id="p2Box">
            <div style="color: #ff4d4d; font-weight: bold; font-size: 14px;">挑战者 (胜场)</div>
            <div class="score-num" id="p2Score">0</div>
            <div class="player-state" id="p2State">已尝试 0 次</div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="guessInput" placeholder="输入选手 ID 启动推导..." autocomplete="off">
        <div id="autocompleteDropdown" class="dropdown"></div>
    </div>
    
    <button id="guessBtn" class="action-btn" onclick="makeGuess()">Confirm / 确认提交</button>
    <button id="restartBtn" class="action-btn" style="background-color: #4caf50; display: none;" onclick="triggerNextRound()">开启下一轮对局 🔄</button>

        let timerInterval = null;

        let isMatchOver = false;

        const ID_PREFIX = "maxtv-cs2026-";
        const inputEl = document.getElementById("guessInput");
        const dropdownEl = document.getElementById("autocompleteDropdown");

        function toggleLobby() {
            const content = document.getElementById("lobbyContent");
            content.style.display = content.style.display === "block" ? "none" : "block";
        }

        // 下拉联想
        inputEl.addEventListener("input", function() {
            if(isMatchOver) return;
            const val = this.value.trim().toLowerCase();
            dropdownEl.innerHTML = ""; 
            if (!val) { dropdownEl.style.display = "none"; return; }
            const matches = db.filter(p => p.name.toLowerCase().startsWith(val));
            if (matches.length > 0) {
                dropdownEl.style.display = "block"; 
                matches.forEach(player => {
                    const item = document.createElement("div");
                    item.className = "dropdown-item";
                    item.innerHTML = player.name;
                    item.onclick = function() {
                        inputEl.value = player.name;
                        dropdownEl.style.display = "none";
                    };
                    dropdownEl.appendChild(item);
                });
            } else { dropdownEl.style.display = "none"; }
        });
        document.addEventListener("click", function(e) { if (e.target !== inputEl) { dropdownEl.style.display = "none"; } });

        function initGame() {
            isOnlineMode = false;
            isMatchOver = false;
            document.getElementById("modeBadge").className = "mode-badge mode-local";
            document.getElementById("modeBadge").innerText = "📴 单机练习模式";
            document.getElementById("timerBanner").style.display = "none";
            generateLocalQuestion();
            initPeer();
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', () => {
                document.getElementById('connectionStatus').innerText = "🟢 联网模块已就绪。请输入房间号完成连接";
            });
            peer.on('connection', (connection) => {
                if (myRole !== 'host') return;
                conn = connection;
                setupConnection();
            });
        }

        function createRoom() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(!code) return alert('请输入房间号！');
            
            // 读取选中的 BO 赛制
            const boVal = document.querySelector('input[name="boType"]:checked').value;
            boMax = parseInt(boVal);

            roomCode = code; myRole = 'host';
            if(peer) peer.destroy();
            peer = new Peer(ID_PREFIX + roomCode);
            peer.on('open', () => {
                document.getElementById('connectionStatus').innerText = `🏠 房间 [ ${roomCode} ] 已创建 (BO${boMax})，等待对端加入...`;
                document.getElementById('lobbyControls').style.display = 'none';
            });
            peer.on('error', (err) => { if(err.type === 'unavailable-id') { alert('该房间号已被占用'); initPeer(); } });
            peer.on('connection', (connection) => { conn = connection; setupConnection(); });
        }

        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if(!code) return alert('请输入房间号！');
            roomCode = code; myRole = 'guest';
            document.getElementById('connectionStatus').innerText = `⚡ 正在接入房间 [ ${roomCode} ] ...`;
            conn = peer.connect(ID_PREFIX + roomCode);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                isOnlineMode = true;
                isMatchOver = false;
                scores = { host: 0, guest: 0 };
                
                document.getElementById('p1Score').innerText = "0";
                document.getElementById('p2Score').innerText = "0";
                
                // 房主向客机发送赛制信息
                if (myRole === 'host') {
                    conn.send({ type: 'initMatchConfig', boMax: boMax });
                    updateMatchFormatUI();
                    generateNewOnlineQuestion(); 
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'initMatchConfig') {
                    boMax = data.boMax;
                    updateMatchFormatUI();
                } else if (data.type === 'question') {
                    targetPlayer = db[data.index];
                    resetRoundUI();
                    startRoundTimer();
                } else if (data.type === 'shotUpdate') {
                    if(data.role === 'host') {
                        document.getElementById('p1State').innerText = `已尝试 ${data.count} 次`;
                    } else {
                        document.getElementById('p2State').innerText = `已尝试 ${data.count} 次`;
                    }
                } else if (data.type === 'roundOver') {
                    clearInterval(timerInterval);
                    scores = data.scores;
                    document.getElementById('p1Score').innerText = scores.host;
                    document.getElementById('p2Score').innerText = scores.guest;
                    
                    if (data.isTie) {
                        showTieOverlay(data.ansName);
                    } else {
                        showWinOverlay(data.winner, data.ansName, data.matchWinner);
                    }
                } else if (data.type === 'nextRound') {
                    resetRoundUI();
                }
            });
        }

        function updateMatchFormatUI() {
            document.getElementById("modeBadge").className = "mode-badge mode-online";
            document.getElementById("modeBadge").innerText = `⚔️ 联机竞技模式 (房间: ${roomCode})`;
            document.getElementById('matchFormatLabel').innerText = `BO${boMax}`;
            document.getElementById('battleBoard').style.display = 'flex';
            document.getElementById('lobbyContent').style.display = 'none'; 
            document.getElementById("timerBanner").style.display = "block";
        }

        // 核心计时器逻辑
        function startRoundTimer() {
            clearInterval(timerInterval);
            timeLeft = 120;
            document.getElementById("timerBanner").innerText = `⏳ 剩余时间: ${timeLeft} 秒`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timerBanner").innerText = `⏳ 剩余时间: ${timeLeft} 秒`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isOnlineMode && myRole === 'host') {
                        // 房主判定平局并广播
                        handleRoundTimeout();
                    }
                }
            }, 1000);
        }

        // 2分钟时间到判定平局
        function handleRoundTimeout() {
            conn.send({ 
                type: 'roundOver', 
                isTie: true, 
                scores: scores, 
                ansName: targetPlayer.name 
            });
            showTieOverlay(targetPlayer.name);
        }

        function generateLocalQuestion() {
            const randIndex = Math.floor(Math.random() * db.length);
            targetPlayer = db[randIndex];
            resetRoundUI();
        }

        function generateNewOnlineQuestion() {
            const randIndex = Math.floor(Math.random() * db.length);
            targetPlayer = db[randIndex];
            resetRoundUI();
            startRoundTimer();
            conn.send({ type: 'question', index: randIndex });
        }

        function resetRoundUI() {
            document.getElementById("resultsTableBody").innerHTML = "";
            inputEl.value = "";
            inputEl.disabled = false;
            document.getElementById("guessBtn").style.display = "inline-block";
            document.getElementById("guessBtn").disabled = false;
            document.getElementById("restartBtn").style.display = "none";
            
            myShotCount = 0;
            if(isOnlineMode) {
                document.getElementById('p1State').innerText = "已尝试 0 次";
                document.getElementById('p2State').innerText = "已尝试 0 次";
            }
        }

        function makeGuess() {
            if(isMatchOver) return;
            const inputVal = document.getElementById("guessInput").value.trim();
            const guess = db.find(p => p.name.toLowerCase() === inputVal.toLowerCase());
            if (!guess) { alert("❌ 未匹配到有效选手，请检查拼写。"); return; }

            myShotCount++;
            
            if(isOnlineMode) {
                if (myRole === 'host') {
                    document.getElementById('p1State').innerText = `已尝试 ${myShotCount} 次`;
                } else {
                    document.getElementById('p2State').innerText = `已尝试 ${myShotCount} 次`;
                }
                conn.send({ type: 'shotUpdate', role: myRole, count: myShotCount });
            }

            renderLocalRowToTable(guess);

            if (guess.name.toLowerCase() === targetPlayer.name.toLowerCase()) {
                clearInterval(timerInterval);
                if(isOnlineMode) {
                    scores[myRole]++;
                    document.getElementById('p1Score').innerText = scores.host;
                    document.getElementById('p2Score').innerText = scores.guest;

                    const winnerLabel = myRole === 'host' ? '房主' : '挑战者';
                    
                    // 检测整场比赛是否判定胜负 (根据BO赛制过半数胜场判定)
                    let matchWinner = null;
                    const neededWins = Math.ceil(boMax / 2);
                    if (scores.host >= neededWins) matchWinner = '房主';
                    if (scores.guest >= neededWins) matchWinner = '挑战者';

                    conn.send({ 
                        type: 'roundOver', 
                        isTie: false,
                        winner: winnerLabel, 
                        scores: scores, 
                        ansName: targetPlayer.name,
                        matchWinner: matchWinner
                    });
                    
                    showWinOverlay(winnerLabel, targetPlayer.name, matchWinner);
                } else {
                    showLocalWinOverlay();
                }
            }
        }

        function renderLocalRowToTable(guess) {
            const r = judgeColors(guess);
            const isMatch = guess.name.toLowerCase() === targetPlayer.name.toLowerCase();
            const nameClass = isMatch ? "cell-green" : "cell-red";
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="${nameClass}">${guess.name} ${isMatch ? "🟩" : ""}</td>
                <td class="${r.cClass}">${guess.country}</td>
                <td class="${r.tClass}">${guess.team}</td>
                <td class="${r.rClass}">${guess.role}</td>
                <td class="${r.aClass}">${guess.age} 岁 ${r.arrow}</td>
            `;

            const tbody = document.getElementById("resultsTableBody");
            tbody.insertBefore(tr, tbody.firstChild);

            document.getElementById("guessInput").value = "";
            dropdownEl.style.display = "none";
        }

        function judgeColors(guess) {
            let cClass = "cell-red";
            if (guess.country === targetPlayer.country) { cClass = "cell-green"; } 
            else if (guess.region === targetPlayer.region) { cClass = "cell-yellow"; }

            let tClass = guess.team === targetPlayer.team ? "cell-green" : "cell-red";

            let rClass = "cell-red";
            if (guess.role === targetPlayer.role) { rClass = "cell-green"; } 
            else if ((guess.role.includes("步枪") || guess.role.includes("指挥")) && (targetPlayer.role.includes("步枪") || targetPlayer.role.includes("指挥"))) { rClass = "cell-yellow"; }

            let aClass = "cell-red";
            let arrow = guess.age > targetPlayer.age ? "🔽" : "🔼";
            if (guess.age === targetPlayer.age) { aClass = "cell-green"; arrow = ""; } 
            else if (Math.abs(guess.age - targetPlayer.age) <= 2) { aClass = "cell-yellow"; }

            return { cClass, tClass, rClass, aClass, arrow };
        }

        function showLocalWinOverlay() {
            inputEl.disabled = true;
            document.getElementById("guessBtn").style.display = "none";
            document.getElementById("restartBtn").style.display = "inline-block";
            document.getElementById("restartBtn").style.backgroundColor = "#4caf50";
            document.getElementById("restartBtn").innerText = `🏆 推导成功！用时 ${myShotCount} 次尝试。点击开启下个选手 🔄`;
        }

        // 联机胜负结算显示
        function showWinOverlay(winner, ansName, matchWinner) {
            inputEl.disabled = true;
            document.getElementById("guessBtn").style.display = "none";
            
            if (matchWinner) {
                isMatchOver = true;
                document.getElementById("restartBtn").style.display = "inline-block";
                document.getElementById("restartBtn").style.backgroundColor = "#ffb703";
                document.getElementById("restartBtn").innerText = `👑 比赛结束！【${matchWinner}】斩获大满贯冠军！`;
                if(myRole !== 'host') document.getElementById("restartBtn").disabled = true;
                return;
            }

            if(myRole === 'host') {
                document.getElementById("restartBtn").style.display = "inline-block";
                document.getElementById("restartBtn").innerText = `🏆 ${winner} 拿下此轮 · 点击进入下轮对局 🔄`;
            } else {
                document.getElementById("restartBtn").style.display = "inline-block";
                document.getElementById("restartBtn").disabled = true;
                document.getElementById("restartBtn").innerText = `🚨 本轮结束，标准答案：[ ${ansName} ]`;
            }
        }

        // 平局结算显示
        function showTieOverlay(ansName) {
            inputEl.disabled = true;
            document.getElementById("guessBtn").style.display = "none";
            
            if(myRole === 'host') {
                document.getElementById("restartBtn").style.display = "inline-block";
                document.getElementById("restartBtn").style.backgroundColor = "#64748b";
                document.getElementById("restartBtn").innerText = `⏰ 2分钟时间到！双方平局。点击加赛下一轮 🔄`;
            } else {
                document.getElementById("restartBtn").style.display = "inline-block";
                document.getElementById("restartBtn").disabled = true;
                document.getElementById("restartBtn").style.backgroundColor = "#64748b";
                document.getElementById("restartBtn").innerText = `⏰ 时间到平局！答案：[ ${ansName} ]，等待房主开启下轮`;
            }
        }

        function triggerNextRound() {
            if(isMatchOver) {
                // 如果整场比赛打完了，再点就是重开新局
                isMatchOver = false;
                scores = { host: 0, guest: 0 };
                document.getElementById('p1Score').innerText = "0";
                document.getElementById('p2Score').innerText = "0";
            }
            if(isOnlineMode) {
                generateNewOnlineQuestion();
            } else {
                generateLocalQuestion();
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
