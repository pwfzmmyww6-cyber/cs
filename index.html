        body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; padding-bottom: 60px; position: relative; min-height: 100vh; box-sizing: border-box; }
        h1 { color: #e94560; font-size: 24px; }
        .search-container { position: relative; width: 80%; max-width: 300px; margin: 0 auto 15px auto; text-align: left; }
        input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #e94560; outline: none; background-color: #16213e; color: #fff; }
        input::placeholder { color: #888; }
        .dropdown { position: absolute; top: 100%; left: 0; right: 0; background-color: #16213e; border: 1px solid #e94560; border-top: none; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .dropdown-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #1a1a2e; font-size: 16px; }
        .dropdown-item:hover, .dropdown-item:active { background-color: #e94560; color: white; }
        button { padding: 12px 25px; font-size: 16px; background-color: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(233, 69, 96, 0.3); margin-top: 10px; }
        button:active { background-color: #b33045; transform: scale(0.98); }
        #restartBtn { background-color: #4caf50; display: none; box-shadow: 0 4px 6px rgba(76, 175, 80, 0.3); }
        #results { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .guess-row { background-color: #16213e; padding: 15px; border-radius: 10px; width: 90%; max-width: 400px; text-align: left; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 5px solid #e94560; line-height: 1.6; }
        
        /* 📺 Max TV 专属独家高级水印 */
        .watermark {
            position: fixed;
            bottom: 15px;
            right: 15px;
            font-size: 16px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.35);
            background: rgba(233, 69, 96, 0.15);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(233, 69, 96, 0.25);
            letter-spacing: 1px;
            pointer-events: none; /* 防止挡住底部的点击事件 */
            user-select: none;

          { name: "EmiliaQAQ", region: "亚洲", country: "中国", team: "Lynn Vision", role: "步枪手", age: 23 },

        let targetPlayer = db[Math.floor(Math.random() * db.length)];

        const inputEl = document.getElementById("guessInput");
        const dropdownEl = document.getElementById("autocompleteDropdown");

        inputEl.addEventListener("input", function() {
            const val = this.value.trim().toLowerCase();
            dropdownEl.innerHTML = ""; 
            if (!val) { dropdownEl.style.display = "none"; return; }
            
            const matches = db.filter(p => p.name.toLowerCase().startsWith(val));
            if (matches.length > 0) {
                dropdownEl.style.display = "block"; 
                matches.forEach(player => {
                    const item = document.createElement("div");
                    item.className = "dropdown-item";
                    item.innerHTML = player.name;
                    item.onclick = function() {
                        inputEl.value = player.name;
                        dropdownEl.style.display = "none";
                    };
                    dropdownEl.appendChild(item);
                });
            } else {
                dropdownEl.style.display = "none";
            }
        });

        document.addEventListener("click", function(e) {
            if (e.target !== inputEl) { dropdownEl.style.display = "none"; }
        });

        function makeGuess() {
            const inputVal = document.getElementById("guessInput").value.trim();
            const guess = db.find(p => p.name.toLowerCase() === inputVal.toLowerCase());
            
            if (!guess) {
                alert("❌ 查无此人！要不你再看看下拉提示？");
                return;
            }

            let countryColor = "🟥";
            if (guess.country === targetPlayer.country) {
                countryColor = "🟩"; 
            } else if (guess.region === targetPlayer.region) {
                countryColor = "🟨"; 
            }

            let teamColor = guess.team === targetPlayer.team ? "🟩" : "🟥";

            let roleColor = "🟥";
            if (guess.role === targetPlayer.role) {
                roleColor = "🟩";
            } else if ((guess.role.includes("步枪") || guess.role.includes("指挥")) && (targetPlayer.role.includes("步枪") || targetPlayer.role.includes("指挥"))) {
                roleColor = "🟨"; 
            }

            let ageColor = "🟥";
            let arrow = guess.age > targetPlayer.age ? "🔽" : "🔼";
            
            if (guess.age === targetPlayer.age) {
                ageColor = "🟩";
                arrow = "";
            } else if (Math.abs(guess.age - targetPlayer.age) <= 2) {
                ageColor = "🟨"; 
            }

            const html = `
                <div class="guess-row">
                    <strong>ID: ${guess.name}</strong> ${guess.name === targetPlayer.name ? "🟩 盲狙成功！" : "🟥"}<br>
                    🏴 国籍: ${guess.country} ${countryColor}<br>
                    🛡️ 战队: ${guess.team} ${teamColor}<br>
                    🔫 位置: ${guess.role} ${roleColor}<br>
                    🎂 年龄: ${guess.age} 岁 ${ageColor} ${arrow}
                </div>
            `;

            document.getElementById("results").insertAdjacentHTML('afterbegin', html);
            document.getElementById("guessInput").value = ""; 
            dropdownEl.style.display = "none"; 

            if (guess.name === targetPlayer.name) {
                document.getElementById("guessBtn").style.display = "none"; 
                document.getElementById("restartBtn").style.display = "inline-block"; 
                document.getElementById("guessInput").disabled = true; 
            }
        }

        function restartGame() {
            targetPlayer = db[Math.floor(Math.random() * db.length)];
            document.getElementById("results").innerHTML = "";
            document.getElementById("guessBtn").style.display = "inline-block";
            document.getElementById("restartBtn").style.display = "none";
            document.getElementById("guessInput").disabled = false;
            document.getElementById("guessInput").focus();
        }
    </script>
